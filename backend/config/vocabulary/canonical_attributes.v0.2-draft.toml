# =============================================================================

vocabulary_version = "v0.2-draft"

# NOT RELEASABLE: property 7 (sensitivity tier) is TBD by design on every entry
# (G-13.9, gate G-13-B — content owed by G-14/G-15). Do not set true here.
releasable = false

# The scope subjects admitted by the approved G-13.2 revision (§9.0.1). No others.
admitted_scope_subjects = ["person", "qualification"]

# -----------------------------------------------------------------------------
# Normalisation rules, referenced by an attribute's property 5.
# -----------------------------------------------------------------------------

# N-TEXT — approved minimum-semantic rule for a `text` attribute (PD-B, §20.3 / §21.1).
# Unchanged from v0.1-draft.
[normalisation.N-TEXT]
applies_to_data_type = "text"
casing_is_not_meaning = true                    # 1
whitespace_run_length_is_not_meaning = true     # 2 (edge + inter-token run length)
edge_whitespace_is_not_meaning = true           # 2
nothing_else_is_folded = true                   # 3 (any other difference is a difference)
raw_value_retained_and_shown = true             # 4 (G-13.6; comparison-time form only)
# Deliberately NOT decided by N-TEXT (see v0.1-draft): unicode NF, diacritic folding,
# transliteration, punctuation folding, token reordering, alias/nickname, edit distance.

# N-DATE — minimum-semantic rule for a `date` attribute (M12-D3; realises G-12's N3;
# FR-INF-008 "dates ... without altering meaning"). Comparison-time form only; the raw
# as-printed value is what the user sees. Two values are equal iff they denote the same
# calendar date; a different calendar date is a difference.
[normalisation.N-DATE]
applies_to_data_type = "date"
surface_format_is_not_meaning = true    # 1 — "1990-02-01" == "01 Feb 1990" == "1990/02/01"
calendar_date_is_meaning = true         # 2 — a different year/month/day IS a difference
nothing_else_is_folded = true           # 3 — any other difference is a difference
raw_value_retained_and_shown = true     # 4 (G-13.6; comparison-time form only)
# Deliberately NOT decided by N-DATE, and therefore NOT enabled — each is evaluation-
# dependent (D-02 §11.6) and ambiguous without real-corpus evidence: locale-ambiguous
# day/month order (DD/MM vs MM/DD), two-digit-year century inference, partial-date
# completion, timezone/locale shifting, and calendar-system conversion. Adding any is a
# conflict-detection change requiring re-approval (G-13.5).

# -----------------------------------------------------------------------------
# The vocabulary. Two authored entries (M12-D3). Exactly seven properties per entry;
# no eighth (G-13.2). Property order: 1 identifier · 2 display label · 3 semantic
# definition · 4 data type · 5 normalisation rule · 6 multiplicity · 7 tier.
# -----------------------------------------------------------------------------

[[attribute]]
canonical_identifier = "person.full_name"                                                   # 1
display_label = "Full name"                                                                  # 2
semantic_definition = "The name of the person who owns the record, as printed on a document that evidences it."  # 3
data_type = "text"                                                                           # 4
normalisation_rule = "N-TEXT"                                                                # 5

[attribute.multiplicity]
scope_subject = "person"
cardinality = "one"

[attribute.sensitivity_tier]
status = "TBD"
value = ""

[[attribute]]
canonical_identifier = "person.date_of_birth"                                                # 1
display_label = "Date of birth"                                                              # 2
semantic_definition = "The calendar date on which the person who owns the record was born, as printed on a document that evidences it."  # 3
data_type = "date"                                                                           # 4
normalisation_rule = "N-DATE"                                                                # 5

[attribute.multiplicity]
scope_subject = "person"
cardinality = "one"

# 7 — tier TBD by design (G-14/G-15, gate G-13-B). No tier content asserted (D-06.5 §D):
# the controlled MVP treats an un-tiered attribute as sensitive via the G-15 default POLICY
# at the mapping layer — this artefact records no tier here.
[attribute.sensitivity_tier]
status = "TBD"
value = ""
