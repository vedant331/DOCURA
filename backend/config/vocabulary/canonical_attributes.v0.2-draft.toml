# authoritative human record is
#   backend/docs/SPRINT_4_G13_CANONICAL_ATTRIBUTE_VOCABULARY.md
# and it must not diverge from it. v0.1-draft is retained, immutable, as the
# historical artefact (G-13.10); this v0.2-draft supersedes it as the current version.
#
# WHAT CHANGED FROM v0.1-draft (M12-D3, approved 17 Sep 2026 — see
# backend/docs/SPRINT_4_M12_G13_G14_G15_DECISION.md and the decision register):
#   * A SECOND authored entry: `person.date_of_birth` (G-12 §15 candidate; consumer
#     FR-FILL-001; C-a does not apply — its consumer is not the mock form). Properties
#     1–6 complete; property 7 (tier) TBD by design.
#   * A SECOND normalisation rule: `N-DATE`, the minimum-semantic rule for a `date`
#     attribute (realises G-12's N3; grounded in FR-INF-008 "normalise ... dates ...
#     without altering meaning"). A conflict-detection behaviour under approved
#     decision G-13.5; scoped minimally, with ambiguous-format parsing explicitly
#     excluded (that remains evaluation-dependent, D-02 §11.6).
#
# STILL NOT RELEASABLE. Property 7 (sensitivity tier) is TBD on BOTH entries by design
# (G-13.9, gate G-13-B — content owed by G-14/G-15, blocked on A-5 / studies S-1, S-4).
# `releasable = false`. No tier content is asserted here: in particular this file does
# NOT record "date_of_birth = sensitive" — that is a G-14 CONTENT decision A-5 reserves
# (register D-06.5 §D). The G-15 default (adopted for the controlled MVP by M12-D3 —
# "an attribute with no assigned tier is treated as sensitive") is a POLICY applied at
# the controlled-form mapping layer, not a tier written into this artefact.
#
# It is a configuration artefact only. It is NOT wired into extraction: D-01's
# replaceable extraction interface (app/services/extraction.py) is untouched. No date
# extractor exists (OCR/S-6 blocked), so no `person.date_of_birth` value is produced by
