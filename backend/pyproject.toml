[project]
name = "docura-backend"
version = "0.1.0"
description = "DOCURA backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    # EmailStr fields in app.schemas.auth fail at import time without this extra.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # app.core.config reads .env keys directly via dotenv_values.
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # Argon2id password hashing (NFR-SEC-004).
    "argon2-cffi>=23.1",
    # Schema migrations. A runtime dependency, not a dev one: a deployment runs
    # `alembic upgrade head` before the service starts.
    "alembic>=1.13",
    # Starlette parses multipart bodies through this; without it the document
    # upload route raises at import time rather than at request time.
    "python-multipart>=0.0.18",
    # HTTP client for the optional LLM intent provider (app.services.chatbot.llm);
    # imported lazily, only when DOCURA_LLM_PROVIDER is configured.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # tests/test_migrations.py inspects the schema over a synchronous driver.
    "psycopg[binary]>=3.2",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit-style security rules
    "ASYNC",    # async correctness
    "C4", "SIM", "RET", "PIE", "PT", "RUF",
    "ANN",      # type annotations
]
ignore = [
    "ANN401",  # allow typing.Any where genuinely needed
    "S104",    # binding 0.0.0.0 is a deliberate, documented default
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ANN201", "ANN001"]

[tool.ruff.lint.isort]
# Without this, ruff sorts the installed `app` package as third-party.
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
# "." lets mypy resolve the out-of-app ``ocr_candidates`` package that app.evaluation.engines
# imports lazily (M20 candidate adapter); it is not under ``files`` because it is dev/eval-only.
mypy_path = "."
files = ["app", "tests"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true

# The M20/M21 candidate adapter (dev/eval only) imports these lazily; they ship no type stubs
# and are not project dependencies. Not declaring them here is what keeps the no-OCR-dependency
# guard (tests/test_extraction.py) honest. pypdfium2 is the M21 PDF rasterizer (same posture).
[[tool.mypy.overrides]]
module = ["pytesseract", "pytesseract.*", "PIL", "PIL.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the backend root on sys.path so the out-of-app ``ocr_candidates`` package (M20) is
# importable in tests; ``app`` continues to import via its editable install.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL server",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
